<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pirate Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 480px;
            width: 100%;
        }
        h1 { font-size: 2.2rem; margin-bottom: 0.5rem; }
        .subtitle { color: #aaa; margin-bottom: 2rem; font-size: 1rem; }
        .cards { display: flex; flex-direction: column; gap: 1rem; }
        .card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 16px;
            padding: 1.5rem;
            text-decoration: none;
            color: #fff;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .card:hover { background: rgba(255,255,255,0.15); transform: translateY(-2px); }
        .card-icon { font-size: 2rem; width: 48px; text-align: center; }
        .card-content { text-align: left; }
        .card-title { font-size: 1.2rem; font-weight: 600; }
        .card-desc { font-size: 0.85rem; color: #bbb; margin-top: 0.2rem; }
        .stats {
            margin-top: 2rem;
            display: flex;
            justify-content: center;
            gap: 2rem;
            font-size: 0.85rem;
            color: #888;
        }
        .stat-item { text-align: center; }
        .stat-num { font-size: 1.4rem; font-weight: 700; color: #ddd; display: block; }
    </style>
</head>
<body>
    <div class="container">
        <h1>&#x1f4ac; Pirate Chat</h1>
        <p class="subtitle">Local network communication hub</p>
        <div class="cards">
            <a href="/chat" class="card">
                <div class="card-icon">&#x1f4ac;</div>
                <div class="card-content">
                    <div class="card-title">Chat Room</div>
                    <div class="card-desc">Send messages and share images in real time</div>
                </div>
            </a>
            <a href="/files" class="card">
                <div class="card-icon">&#x1f4c1;</div>
                <div class="card-content">
                    <div class="card-title">File Sharing</div>
                    <div class="card-desc">Upload and download files on the local network</div>
                </div>
            </a>
        </div>
        <div class="stats">
            <div class="stat-item"><span class="stat-num" id="stat-users">-</span>Active Users</div>
            <div class="stat-item"><span class="stat-num" id="stat-msgs">-</span>Messages</div>
            <div class="stat-item"><span class="stat-num" id="stat-files">-</span>Files</div>
        </div>
    </div>
    <script>
        fetch('/api/stats').then(r=>r.json()).then(d=>{
            document.getElementById('stat-users').textContent = d.users;
            document.getElementById('stat-msgs').textContent = d.messages_total;
            document.getElementById('stat-files').textContent = d.files_total;
        }).catch(()=>{});
        setInterval(()=>{
            fetch('/api/stats').then(r=>r.json()).then(d=>{
                document.getElementById('stat-users').textContent = d.users;
                document.getElementById('stat-msgs').textContent = d.messages_total;
                document.getElementById('stat-files').textContent = d.files_total;
            }).catch(()=>{});
        }, 15000);
    </script>
</body>
</html>
