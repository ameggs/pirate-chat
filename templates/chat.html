<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pirate Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div id="app">
        <nav class="nav-bar">
            <a href="/chat" class="nav-item active">💬 Chat</a>
            <a href="/files" class="nav-item">📁 Files</a>
        </nav>
        <div id="login-modal" class="modal-overlay">
            <div class="modal">
                <div class="modal-icon">💬</div>
                <h1 class="modal-title">Pirate Chat</h1>
                <p class="modal-subtitle">Welcome! Choose a username to join the conversation.</p>
                <form id="login-form">
                    <input type="text" id="username-input" class="modal-input" placeholder="Enter your username..." maxlength="24" autocomplete="off" required>
                    <button type="submit" class="modal-btn">Join Chat</button>
                </form>
            </div>
        </div>
        <div id="chat-container">
            <header id="chat-header">
                <div class="header-left">
                    <span class="header-icon">💬</span>
                    <span class="header-title">Pirate Chat</span>
                </div>
                <div class="header-right">
                    <span id="user-badge" class="user-badge"></span>
                    <button id="logout-btn" class="header-btn" title="Change username">&times;</button>
                </div>
            </header>
            <div id="messages-container">
                <div id="messages"></div>
            </div>
            <footer id="input-bar">
                <form id="message-form">
                    <button type="button" id="upload-btn" class="input-btn upload-btn" title="Send image">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                            <circle cx="8.5" cy="8.5" r="1.5"/>
                            <polyline points="21 15 16 10 5 21"/>
                        </svg>
                    </button>
                    <input type="text" id="message-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="send-btn" class="input-btn send-btn" title="Send message">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="22" y1="2" x2="11" y2="13"/>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                        </svg>
                    </button>
                </form>
            </footer>
        </div>
        <input type="file" id="image-input" accept="image/jpeg,image/png,image/gif,image/webp" hidden>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
